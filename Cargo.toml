[package]
name = "api-paginate"
description = "Pagination types for Rust APIs — offset-based and cursor-based pagination with OpenAPI support"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/paginate"
keywords = ["pagination", "api", "cursor"]
categories = ["web-programming"]
readme = "README.md"
exclude = ["/target"]

[features]
default = ["serde_impl"]
serde_impl = ["dep:serde"]
openapi = ["dep:utoipa"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
utoipa = { version = "5", optional = true }

[[bench]]
name = "paginate_bench"
harness = false

[dev-dependencies]
proptest = "1"
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
